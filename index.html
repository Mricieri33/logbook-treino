<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LOGBOOK DE TREINO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d0d">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0d0d;
    --panel:#181818;
    --panel-alt:#1f1f1f;
    --border:#2e2e2e;
    --text:#f2f2f2;
    --muted:#b7b7b7;
    --accent:#c8ed33;
    --accent-dim:#5f7015;
    --on-accent:#0d0d0d;
    --ok:#c8ed33;
    --steel:#8a8a8a;
    --font-display:"Bebas Neue", Impact, system-ui, sans-serif;
    --font-body:"Barlow", system-ui, -apple-system, sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    margin:0;
    padding:0 0 40px 0;
  }

  /* ===== TOPO ===== */
  .topbar{
    background:linear-gradient(180deg,#1c1c1e,#141415);
    border-bottom:3px solid var(--accent);
    padding:14px 16px 10px 16px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .topbar h1{
    font-family:var(--font-display);
    font-weight:400;
    font-size:26px;
    letter-spacing:0.04em;
    margin:0;
    text-transform:uppercase;
  }
  .topbar h1 span{color:var(--accent);}

  .day-btns{
    display:flex;
    gap:5px;
    margin-top:12px;
  }
  .day-btn{
    flex:1;
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--muted);
    padding:9px 0;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    cursor:pointer;
    border-radius:4px;
    text-align:center;
  }
  .day-btn.active{
    background:var(--accent);
    color:var(--on-accent);
    border-color:var(--accent);
  }
  .day-btn.off{opacity:0.45;}

  /* ===== CORPO ===== */
  .wrap{max-width:620px;margin:0 auto;padding:16px;}

  .day-focus-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .day-focus{
    color:var(--text);
    font-size:16px;
    font-weight:600;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--steel);
    cursor:pointer;
    font-size:12px;
    text-decoration:underline;
    padding:0;
  }
  .link-btn:hover{color:var(--text);}

  .off-day{
    background:var(--panel);
    border:1px dashed var(--border);
    border-radius:8px;
    padding:50px 20px;
    text-align:center;
    color:var(--muted);
    font-family:var(--font-display);
    font-weight:400;
    letter-spacing:0.14em;
    font-size:22px;
    text-transform:uppercase;
    margin-bottom:12px;
  }
  .rest-note{
    background:var(--panel-alt);
    border-left:2px solid var(--steel);
    border-radius:0 4px 4px 0;
    padding:9px 11px;
    font-size:11px;
    color:var(--muted);
    line-height:1.5;
    margin-bottom:16px;
  }

  /* ===== BLOCO DE EXERCÍCIO ===== */
  .ex-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px;
    margin-bottom:12px;
  }
  .ex-head{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-bottom:12px;
  }
  .ex-move{
    display:flex;
    flex-direction:column;
    gap:3px;
    flex-shrink:0;
  }
  .move-btn{
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--muted);
    width:26px;
    height:22px;
    font-size:9px;
    line-height:1;
    border-radius:3px;
    cursor:pointer;
    padding:0;
  }
  .move-btn:disabled{opacity:0.2;cursor:default;}
  .move-btn:not(:disabled):active{background:var(--accent);color:var(--on-accent);}
  .ex-title-wrap{flex:1;min-width:0;}
  .ex-title{
    font-size:15px;
    font-weight:600;
    line-height:1.3;
  }
  .ex-actions{margin-top:4px;}
  .ex-actions button{
    background:none;
    border:none;
    cursor:pointer;
    font-size:11px;
    text-decoration:underline;
    padding:0;
    margin-right:12px;
  }
  .act-edit{color:var(--steel);}
  .act-edit:hover{color:var(--text);}
  .act-del{color:var(--steel);}
  .act-del:hover{color:var(--accent);}

  /* campos série/reps/kg */
  .fields{
    display:flex;
    gap:10px;
  }
  .field{
    flex:1;
    text-align:center;
  }
  .field label{
    display:block;
    font-size:10px;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:0.18em;
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
    text-align:center;
    padding:9px 4px;
    border-radius:5px;
    font-family:var(--font-display);
    font-size:26px;
    letter-spacing:0.02em;
  }
  .field input:focus{outline:none;border-color:var(--accent);}
  .field input:disabled{opacity:0.45;}

  /* drop/cluster */
  .extra-add{
    margin-top:10px;
    font-size:11px;
    color:var(--steel);
    cursor:pointer;
    text-align:center;
    border:1px dashed var(--border);
    border-radius:5px;
    padding:7px 0;
  }
  .extra-add:hover{color:var(--text);border-color:var(--steel);}
  .extra-badge{
    margin-top:10px;
    font-size:11px;
    color:var(--accent);
    cursor:pointer;
    text-align:center;
    background:var(--panel-alt);
    border-radius:5px;
    padding:8px;
    line-height:1.4;
    word-break:break-word;
  }
  .extra-badge:hover{outline:1px solid var(--steel);}

  /* ===== RODAPÉ DO DIA ===== */
  .day-footer{margin-top:6px;}
  .add-ex-btn{
    width:100%;
    background:var(--panel-alt);
    border:1px dashed var(--steel);
    color:var(--muted);
    padding:12px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:14px;
  }
  .add-ex-btn:hover{color:var(--text);}
  .day-tools{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }
  .day-tools select{
    flex:1;
    min-width:140px;
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 10px;
    border-radius:5px;
    font-size:12px;
  }
  .tool-btn{
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 14px;
    border-radius:5px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .tool-btn:hover{border-color:var(--accent);}

  /* ===== NOTICE (Chrome/instalação) ===== */
  .notice-bar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    padding:11px 13px;
    border-radius:6px;
    font-size:12px;
    line-height:1.45;
    margin-bottom:16px;
  }
  .notice-bar.alert{background:#2A1613;border:1px solid var(--accent-dim);color:var(--text);}
  .notice-bar.info{background:var(--panel-alt);border:1px solid var(--border);color:var(--text);}
  .notice-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .notice-btn{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:7px 12px;
    border-radius:4px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .notice-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}

  /* ===== MODAL ===== */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:18px;
    max-width:420px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
  }
  .modal-msg{font-size:13px;color:var(--text);margin-bottom:14px;line-height:1.5;}
  .modal-box label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;}
  .modal-box input, .modal-box select{
    width:100%;
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px;
    border-radius:5px;
    margin-bottom:10px;
    font-size:14px;
  }
  .modal-box input:focus, .modal-box select:focus{outline:none;border-color:var(--accent);}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
  .modal-actions button{
    padding:10px 16px;
    border-radius:5px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    border:1px solid var(--border);
  }
  .btn-cancel{background:var(--panel-alt);color:var(--muted);}
  .btn-confirm{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
  .bw-toggle{
    display:flex;align-items:center;gap:8px;
    font-size:13px;color:var(--text);
    background:var(--panel-alt);border:1px solid var(--border);
    border-radius:5px;padding:10px;margin-bottom:8px;cursor:pointer;
  }
  .bw-toggle input{width:auto;margin:0;}
  .bw-hint{font-size:10px;color:var(--muted);margin:0 0 12px 0;line-height:1.4;}
  .setcount-group{display:flex;gap:8px;margin-bottom:12px;}
  .setcount-opt{
    flex:1;text-align:center;padding:12px 0;
    border:1px solid var(--border);border-radius:6px;
    background:var(--panel-alt);color:var(--muted);
    font-size:15px;font-weight:700;cursor:pointer;
  }
  .setcount-opt.sel{
    border-color:var(--accent);color:var(--text);
    background:var(--panel);box-shadow:inset 0 -3px 0 var(--accent);
  }
  .setcount-opt span{display:block;font-size:9px;font-weight:400;color:var(--steel);margin-top:2px;}
  .extra-part-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
  .extra-part-row input{flex:1;margin-bottom:0;}
  .extra-part-row .x-btn{
    width:34px;height:34px;flex-shrink:0;
    background:var(--panel-alt);border:1px solid var(--border);
    color:var(--muted);border-radius:5px;cursor:pointer;font-size:13px;
  }
  .help-block{background:var(--panel-alt);border-radius:5px;padding:9px 11px;font-size:12px;line-height:1.5;margin-bottom:8px;}

  .example-note{
    background:var(--panel-alt);
    border-left:2px solid var(--accent);
    border-radius:0 4px 4px 0;
    padding:9px 12px;
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
    margin-bottom:16px;
  }
  .app-version{
    position:fixed;bottom:6px;right:10px;
    font-size:10px;color:var(--muted);opacity:0.5;
    letter-spacing:0.5px;pointer-events:none;z-index:5;
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>LOGBOOK DE <span>TREINO</span></h1>
  <div class="day-btns" id="dayBtns"></div>
</div>

<div class="wrap">
  <div id="noticeBar"></div>
  <div class="example-note">Abaixo é um exemplo, edite seu treino como quiser.</div>
  <div class="day-focus-row">
    <span class="day-focus" id="dayFocus"></span>
    <button class="link-btn" onclick="editDayFocus()">editar</button>
  </div>
  <div id="dayContent"></div>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none;">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="app-version">v3.3</div>

<script>
/* ============ PLANO PADRÃO ============ */
const DEFAULT_PLAN = {
  days: [
    { id:'seg', label:'Seg', focus:'Peito 1 (superior) + Tríceps + Antebraço', off:false, slots:[
      {id:'seg-1', name:'Supino inclinado barra (30°)', sets:4},
      {id:'seg-2', name:'Supino reto halteres', sets:3},
      {id:'seg-3', name:'Crucifixo inclinado halteres', sets:3},
      {id:'seg-4', name:'Crossover no cabo (baixo pra cima)', sets:3},
      {id:'seg-5', name:'Mergulho em paralelas', sets:3},
      {id:'seg-6', name:'Tríceps testa barra EZ', sets:3},
      {id:'seg-7', name:'Rosca de punho barra', sets:3}
    ]},
    { id:'ter', label:'Ter', focus:'Costas + Bíceps + Antebraço', off:false, slots:[
      {id:'ter-1', name:'Levantamento terra em bloco (abaixo do joelho)', sets:4},
      {id:'ter-2', name:'Barra fixa pegada aberta', sets:4},
      {id:'ter-3', name:'Remada curvada barra', sets:3},
      {id:'ter-4', name:'Remada cavalinho (T-bar)', sets:3},
      {id:'ter-5', name:'Pull-over halter', sets:3},
      {id:'ter-6', name:'Rosca scott', sets:4},
      {id:'ter-7', name:'Rosca concentrada halter', sets:3},
      {id:'ter-8', name:'Rosca inversa barra', sets:3}
    ]},
    { id:'qua', label:'Qua', focus:'Ombros (posterior + largura) + Panturrilha + Antebraço', off:false, slots:[
      {id:'qua-1', name:'Crucifixo invertido máquina ou halteres', sets:4},
      {id:'qua-2', name:'Face pull', sets:4},
      {id:'qua-3', name:'Desenvolvimento atrás da nuca', sets:4},
      {id:'qua-4', name:'Elevação lateral halteres', sets:4},
      {id:'qua-5', name:'Panturrilha em pé', sets:4},
      {id:'qua-6', name:'Rosca de punho inversa', sets:3}
    ]},
    { id:'qui', label:'Qui', focus:'Treino', off:false, slots:[] },
    { id:'sex', label:'Sex', focus:'Pernas (agachamento + posterior) + Panturrilha', off:false, slots:[
      {id:'sex-1', name:'Agachamento livre barra', sets:4},
      {id:'sex-2', name:'Stiff barra', sets:4},
      {id:'sex-3', name:'Mesa flexora', sets:4},
      {id:'sex-4', name:'Elevação pélvica ou bom dia', sets:3},
      {id:'sex-5', name:'Cadeira extensora', sets:2},
      {id:'sex-6', name:'Panturrilha sentado', sets:3}
    ]},
    { id:'sab', label:'Sáb', focus:'Peito 2 (geral/inferior) + Tríceps', off:false, slots:[
      {id:'sab-1', name:'Supino reto máquina ou smith', sets:4},
      {id:'sab-2', name:'Supino declinado ou peck deck', sets:3},
      {id:'sab-3', name:'Crucifixo reto ou máquina', sets:3},
      {id:'sab-4', name:'Mergulho em paralelas', sets:3},
      {id:'sab-5', name:'Tríceps corda na polia', sets:3}
    ]},
    { id:'dom', label:'Dom', focus:'Treino', off:false, slots:[] }
  ]
};

let plan = null;
let log = {};          // { slotId: { sets, reps, weight, extra } } — registro "de hoje", sobrescreve
let activeDayId = null;
let saveTimer = null;

/* ============ STORAGE ============ */
async function loadData(){
  try{
    const p = localStorage.getItem('lb3_plan');
    plan = p ? JSON.parse(p) : JSON.parse(JSON.stringify(DEFAULT_PLAN));
  }catch(e){ plan = JSON.parse(JSON.stringify(DEFAULT_PLAN)); }
  try{
    const l = localStorage.getItem('lb3_log');
    log = l ? JSON.parse(l) : {};
  }catch(e){ log = {}; }
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem('lb3_plan', JSON.stringify(plan));
      localStorage.setItem('lb3_log', JSON.stringify(log));
    }catch(e){}
  }, 400);
}

/* ============ MODAIS ============ */
let modalCallback = null;
function showModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').style.display = 'flex';
}
function closeModal(){
  document.getElementById('modalOverlay').style.display = 'none';
  modalCallback = null;
}
function modalConfirmAction(){ if(modalCallback) modalCallback(); }
function showConfirm(msgHtml, onYes){
  modalCallback = ()=>{ closeModal(); onYes(); };
  showModal(
    '<div class="modal-msg">'+msgHtml+'</div>'+
    '<div class="modal-actions">'+
      '<button class="btn-cancel" onclick="closeModal()">Cancelar</button>'+
      '<button class="btn-confirm" onclick="modalConfirmAction()">Confirmar</button>'+
    '</div>'
  );
}
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
function escapeAttr(str){ return escapeHtml(str).replace(/"/g,'&quot;'); }
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });

function parseDecimal(value){
  const raw = String(value).replace(',', '.').trim();
  if(raw === '') return undefined;
  const num = Number(raw);
  return isNaN(num) ? undefined : num;
}

/* ============ RENDER: BOTÕES DOS DIAS ============ */
function renderDayBtns(){
  const wrap = document.getElementById('dayBtns');
  wrap.innerHTML = '';
  plan.days.forEach(day=>{
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (day.id===activeDayId?' active':'') + (day.off?' off':'');
    btn.textContent = day.label;
    btn.onclick = ()=>{ activeDayId = day.id; renderDayBtns(); renderDayContent(); };
    wrap.appendChild(btn);
  });
}

/* ============ RENDER: CONTEÚDO DO DIA ============ */
function renderDayContent(){
  const day = plan.days.find(d=>d.id===activeDayId);
  document.getElementById('dayFocus').textContent = day.focus;
  const container = document.getElementById('dayContent');
  container.innerHTML = '';

  if(day.off){
    const guardados = day.slots.length
      ? '<div class="rest-note">'+day.slots.length+' exercício(s) guardado(s) neste dia. Toque em <b>editar</b> e troque "descanso" por um foco de treino para reabrir.</div>'
      : '';
    container.innerHTML = '<div class="off-day">Descanso</div>'+guardados;
    container.appendChild(buildDayTools(day));
    return;
  }

  day.slots.forEach((slot, idx)=>{
    container.appendChild(buildExCard(day, slot, idx));
  });

  const footer = document.createElement('div');
  footer.className = 'day-footer';
  const addBtn = document.createElement('button');
  addBtn.className = 'add-ex-btn';
  addBtn.textContent = '+ adicionar exercício';
  addBtn.onclick = ()=> addSlot(day.id);
  footer.appendChild(addBtn);
  footer.appendChild(buildDayTools(day));
  container.appendChild(footer);
}

function buildExCard(day, slot, idx){
  const card = document.createElement('div');
  card.className = 'ex-card';
  const isFirst = idx===0;
  const isLast = idx===day.slots.length-1;
  const e = log[slot.id] || {};
  const isBW = !!slot.bodyweight;

  card.innerHTML =
    '<div class="ex-head">'+
      '<div class="ex-move">'+
        '<button class="move-btn" '+(isFirst?'disabled':'')+' onclick="moveSlot(\''+day.id+'\',\''+slot.id+'\',-1)" title="Mover para cima">&#9650;</button>'+
        '<button class="move-btn" '+(isLast?'disabled':'')+' onclick="moveSlot(\''+day.id+'\',\''+slot.id+'\',1)" title="Mover para baixo">&#9660;</button>'+
      '</div>'+
      '<div class="ex-title-wrap">'+
        '<div class="ex-title">'+escapeHtml(slot.name)+'</div>'+
        '<div class="ex-actions">'+
          '<button class="act-edit" onclick="editSlot(\''+day.id+'\',\''+slot.id+'\')">editar</button>'+
          '<button class="act-del" onclick="deleteSlot(\''+day.id+'\',\''+slot.id+'\')">excluir</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="fields">'+
      '<div class="field"><label>série</label>'+
        '<input type="number" min="0" max="4" placeholder="'+(slot.sets||'')+'" value="'+(e.sets??'')+'" onchange="updateLog(\''+slot.id+'\',\'sets\',this.value)"></div>'+
      '<div class="field"><label>reps</label>'+
        '<input type="number" min="0" placeholder="0" value="'+(e.reps??'')+'" onchange="updateLog(\''+slot.id+'\',\'reps\',this.value)"></div>'+
      '<div class="field"><label>'+(isBW?'PC':'kg')+'</label>'+
        (isBW
          ? '<input type="text" value="PC" disabled title="Peso corporal">'
          : '<input type="text" inputmode="decimal" placeholder="0" value="'+(e.weight??'')+'" onchange="updateLog(\''+slot.id+'\',\'weight\',this.value)">')+
      '</div>'+
    '</div>'+
    buildExtraEl(slot.id, e);

  return card;
}

function buildExtraEl(slotId, e){
  if(e.extra && e.extra.parts && e.extra.parts.length){
    return '<div class="extra-badge" onclick="openExtraModal(\''+slotId+'\')">'+escapeHtml(extraSummary(e.extra))+'</div>';
  }
  return '<div class="extra-add" onclick="openExtraModal(\''+slotId+'\')">+ drop/cluster</div>';
}

/* ============ REGISTRO ============ */
function updateLog(slotId, field, value){
  log[slotId] = log[slotId] || {};
  let num = parseDecimal(value);
  if(field==='sets' && num!=null && num>4) num = 4;
  log[slotId][field] = num;
  scheduleSave();
}

/* ============ MOVER / EXCLUIR / EDITAR / ADICIONAR ============ */
function moveSlot(dayId, slotId, dir){
  const day = plan.days.find(d=>d.id===dayId);
  const i = day.slots.findIndex(s=>s.id===slotId);
  const j = i+dir;
  if(i===-1 || j<0 || j>=day.slots.length) return;
  const tmp = day.slots[i]; day.slots[i]=day.slots[j]; day.slots[j]=tmp;
  scheduleSave();
  renderDayContent();
}

function deleteSlot(dayId, slotId){
  const day = plan.days.find(d=>d.id===dayId);
  const slot = day.slots.find(s=>s.id===slotId);
  showConfirm(
    'Excluir <b>'+escapeHtml(slot?slot.name:'este exercício')+'</b> deste dia?',
    ()=>{
      day.slots = day.slots.filter(s=>s.id!==slotId);
      delete log[slotId];
      scheduleSave();
      renderDayContent();
    }
  );
}

let newSlotSetCount = 3;
function setCountGroupHtml(sel){
  return '<div class="setcount-group">'+
    [2,3,4].map(n=>'<div class="setcount-opt'+(n===sel?' sel':'')+'" data-n="'+n+'" onclick="selectSetCount('+n+')">'+n+'<span>séries</span></div>').join('')+
  '</div>';
}
function selectSetCount(n){
  newSlotSetCount = n;
  document.querySelectorAll('.setcount-opt').forEach(el=>{
    el.classList.toggle('sel', Number(el.dataset.n)===n);
  });
}

function editSlot(dayId, slotId){
  const day = plan.days.find(d=>d.id===dayId);
  const slot = day.slots.find(s=>s.id===slotId);
  const isBW = !!slot.bodyweight;
  newSlotSetCount = slot.sets || 3;
  modalCallback = ()=>{
    const nome = document.getElementById('mNome').value;
    if(!nome || !nome.trim()) return;
    slot.name = nome.trim();
    slot.sets = newSlotSetCount;
    slot.bodyweight = document.getElementById('mBW').checked;
    scheduleSave();
    closeModal();
    renderDayContent();
  };
  showModal(
    '<div class="modal-msg">Editar exercício</div>'+
    '<label>Nome</label>'+
    '<input id="mNome" value="'+escapeAttr(slot.name)+'">'+
    '<label>Quantas séries?</label>'+
    setCountGroupHtml(slot.sets||3)+
    '<label class="bw-toggle"><input type="checkbox" id="mBW" '+(isBW?'checked':'')+'> Peso corporal (sem carga)</label>'+
    '<div class="modal-actions">'+
      '<button class="btn-cancel" onclick="closeModal()">Cancelar</button>'+
      '<button class="btn-confirm" onclick="modalConfirmAction()">Salvar</button>'+
    '</div>'
  );
}

function addSlot(dayId){
  newSlotSetCount = 3;
  modalCallback = ()=>{
    const nome = document.getElementById('mNome').value;
    if(!nome || !nome.trim()) return;
    const bw = document.getElementById('mBW').checked;
    const day = plan.days.find(d=>d.id===dayId);
    const id = dayId+'-'+Date.now();
    day.slots.push({id, name:nome.trim(), sets:newSlotSetCount, bodyweight:bw});
    scheduleSave();
    closeModal();
    renderDayContent();
  };
  showModal(
    '<div class="modal-msg">Novo exercício</div>'+
    '<label>Nome</label>'+
    '<input id="mNome" placeholder="Ex: Hack machine">'+
    '<label>Quantas séries?</label>'+
    setCountGroupHtml(3)+
    '<label class="bw-toggle"><input type="checkbox" id="mBW"> Peso corporal (sem carga)</label>'+
    '<div class="modal-actions">'+
      '<button class="btn-cancel" onclick="closeModal()">Cancelar</button>'+
      '<button class="btn-confirm" onclick="modalConfirmAction()">Adicionar</button>'+
    '</div>'
  );
}

/* ============ EDITAR FOCO DO DIA ============ */
function isRestText(txt){
  // "descanso", "descanço", "off", "folga" — tolera acento e caixa
  const t = String(txt||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return t==='descanso' || t==='descanco' || t==='off' || t==='folga';
}

function editDayFocus(){
  const day = plan.days.find(d=>d.id===activeDayId);
  modalCallback = ()=>{
    const novo = document.getElementById('mFocus').value;
    if(!novo || !novo.trim()) return;
    day.focus = novo.trim();
    // Escrever "descanso" fecha o dia; os exercícios ficam guardados (voltam se reabrir).
    day.off = isRestText(novo);
    scheduleSave();
    closeModal();
    renderDayBtns();
    renderDayContent();
  };
  showModal(
    '<div class="modal-msg">Descrição do dia</div>'+
    '<label>Foco</label>'+
    '<input id="mFocus" value="'+escapeAttr(day.focus)+'">'+
    '<div class="bw-hint">Escreva <b>descanso</b> para fechar o dia (os exercícios ficam guardados e voltam se você reabrir).</div>'+
    '<div class="modal-actions">'+
      '<button class="btn-cancel" onclick="closeModal()">Cancelar</button>'+
      '<button class="btn-confirm" onclick="modalConfirmAction()">Salvar</button>'+
    '</div>'
  );
}

/* ============ DROP SET / CLUSTER SET ============ */
function extraSummary(extra){
  if(!extra || !extra.parts || !extra.parts.length) return '';
  const label = extra.type==='cluster' ? 'Cluster' : 'Drop';
  const parts = extra.parts.map(p=>{
    const w = (p.weight!=null && p.weight!=='') ? p.weight+'kg' : '';
    const r = (p.reps!=null && p.reps!=='') ? p.reps+'r' : '';
    return [w,r].filter(Boolean).join(' ');
  }).join(' → ');
  return label+': '+parts;
}
function extraPartRowHtml(w, r){
  return '<div class="extra-part-row">'+
    '<input type="text" inputmode="decimal" class="ex-w" placeholder="kg" value="'+(w??'')+'">'+
    '<input type="number" class="ex-r" placeholder="reps" value="'+(r??'')+'">'+
    '<button type="button" class="x-btn" onclick="this.parentElement.remove()">&#10005;</button>'+
  '</div>';
}
function addExtraPartRow(){
  const c = document.getElementById('extraParts');
  const d = document.createElement('div');
  d.innerHTML = extraPartRowHtml('','');
  c.appendChild(d.firstElementChild);
}
function openExtraModal(slotId){
  const e = log[slotId] || {};
  const existing = e.extra || null;
  const type = existing ? existing.type : 'drop';
  const parts = existing && existing.parts.length ? existing.parts : [{weight:'',reps:''},{weight:'',reps:''}];
  let partsHtml = '';
  parts.forEach(p=>{ partsHtml += extraPartRowHtml(p.weight, p.reps); });
  showModal(
    '<div class="modal-msg">Drop set ou cluster set<br>'+
    '<span style="color:var(--muted);font-size:11px;">Drop: mesma série, cai o peso sem descanso. Cluster: mesma carga, quebrada em blocos com descanso curto.</span></div>'+
    '<label>Tipo</label>'+
    '<select id="exType">'+
      '<option value="drop"'+(type==='drop'?' selected':'')+'>Drop set</option>'+
      '<option value="cluster"'+(type==='cluster'?' selected':'')+'>Cluster set</option>'+
    '</select>'+
    '<label>Partes (peso e reps de cada queda/bloco)</label>'+
    '<div id="extraParts">'+partsHtml+'</div>'+
    '<button type="button" class="add-ex-btn" onclick="addExtraPartRow()">+ adicionar parte</button>'+
    '<div class="modal-actions">'+
      (existing ? '<button class="btn-cancel" onclick="removeExtra(\''+slotId+'\')">Remover</button>' : '')+
      '<button class="btn-cancel" onclick="closeModal()">Cancelar</button>'+
      '<button class="btn-confirm" onclick="saveExtra(\''+slotId+'\')">Salvar</button>'+
    '</div>'
  );
}
function saveExtra(slotId){
  const type = document.getElementById('exType').value;
  const rows = document.querySelectorAll('#extraParts .extra-part-row');
  const parts = [];
  rows.forEach(row=>{
    const w = row.querySelector('.ex-w').value;
    const r = row.querySelector('.ex-r').value;
    if(w!=='' || r!==''){
      parts.push({ weight: parseDecimal(w), reps: r!==''?Number(r):undefined });
    }
  });
  log[slotId] = log[slotId] || {};
  if(parts.length===0) delete log[slotId].extra;
  else log[slotId].extra = {type, parts};
  scheduleSave();
  closeModal();
  renderDayContent();
}
function removeExtra(slotId){
  if(log[slotId]) delete log[slotId].extra;
  scheduleSave();
  closeModal();
  renderDayContent();
}

/* ============ FERRAMENTAS DO DIA (trocar / clonar) ============ */
function buildDayTools(day){
  const wrap = document.createElement('div');
  wrap.className = 'day-tools';

  const sel = document.createElement('select');
  plan.days.filter(d=>d.id!==day.id).forEach(d=>{
    const o = document.createElement('option');
    o.value = d.id;
    o.textContent = d.label + (d.off ? ' — Descanso' : ' — ' + d.focus);
    sel.appendChild(o);
  });
  wrap.appendChild(sel);

  const swapBtn = document.createElement('button');
  swapBtn.className = 'tool-btn';
  swapBtn.textContent = 'Trocar dia';
  swapBtn.onclick = ()=>{
    const target = plan.days.find(d=>d.id===sel.value);
    showConfirm(
      'Trocar <b>'+day.label+'</b> com <b>'+target.label+'</b>? O conteúdo dos dois dias troca de lugar.',
      ()=> swapDays(day.id, target.id)
    );
  };
  wrap.appendChild(swapBtn);

  if(!day.off && day.slots.length){
    const cloneBtn = document.createElement('button');
    cloneBtn.className = 'tool-btn';
    cloneBtn.textContent = 'Clonar para';
    cloneBtn.onclick = ()=>{
      const target = plan.days.find(d=>d.id===sel.value);
      const destInfo = target.slots.length
        ? 'A <b>'+target.label+'</b> já tem exercícios — serão substituídos.'
        : 'A <b>'+target.label+'</b> receberá os exercícios da '+day.label+'.';
      showConfirm(
        'Clonar os '+day.slots.length+' exercícios de <b>'+day.label+'</b> para <b>'+target.label+'</b>?<br><br>'+destInfo+'<br><br>Copia só os exercícios (nome, séries), sem os registros.',
        ()=> cloneDay(day.id, target.id)
      );
    };
    wrap.appendChild(cloneBtn);
  }

  return wrap;
}

function swapDays(idA, idB){
  const a = plan.days.find(d=>d.id===idA);
  const b = plan.days.find(d=>d.id===idB);
  const tmp = {focus:a.focus, off:a.off, slots:a.slots};
  a.focus=b.focus; a.off=b.off; a.slots=b.slots;
  b.focus=tmp.focus; b.off=tmp.off; b.slots=tmp.slots;
  scheduleSave();
  renderDayBtns();
  renderDayContent();
}

function cloneDay(fromId, toId){
  const from = plan.days.find(d=>d.id===fromId);
  const to = plan.days.find(d=>d.id===toId);
  if(!from || !to) return;
  to.slots = from.slots.map(s=>{
    const nova = JSON.parse(JSON.stringify(s));
    nova.id = toId+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
    return nova;
  });
  to.off = false;
  to.focus = from.focus;
  scheduleSave();
  activeDayId = toId;
  renderDayBtns();
  renderDayContent();
}

/* ============ AMBIENTE / INSTALAÇÃO ============ */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstallPrompt=e; renderNotice(); });
window.addEventListener('appinstalled', ()=>{ deferredInstallPrompt=null; renderNotice(); });

function storageWorks(){
  try{ localStorage.setItem('__t','1'); const ok=localStorage.getItem('__t')==='1'; localStorage.removeItem('__t'); return ok; }
  catch(e){ return false; }
}
function isStandalone(){
  try{ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true; }
  catch(e){ return false; }
}
function isInAppBrowser(){
  const ua = navigator.userAgent||'';
  return /FBAN|FBAV|FB_IAB|Instagram|Line\//i.test(ua) || /Twitter|LinkedInApp|MicroMessenger|; wv\)/i.test(ua);
}
async function requestPersistentStorage(){
  try{ if(navigator.storage && navigator.storage.persist){ const a=await navigator.storage.persisted(); if(!a) await navigator.storage.persist(); } }catch(e){}
}
function copyAppLink(btn){
  const url = window.location.href.split('#')[0];
  const done = ()=>{ if(btn){ const o=btn.textContent; btn.textContent='Link copiado'; setTimeout(()=>btn.textContent=o,2000); } };
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done).catch(()=>fallbackCopy(url,done)); return; } }catch(e){}
  fallbackCopy(url, done);
}
function fallbackCopy(text, done){
  try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(); }catch(e){}
}
async function triggerInstall(){
  if(!deferredInstallPrompt){ showInstallHelp(); return; }
  try{ deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; }catch(e){}
  deferredInstallPrompt=null; renderNotice();
}
function dismissInstallNotice(){ try{ localStorage.setItem('install_notice_off','1'); }catch(e){} renderNotice(); }
function showInstallHelp(){
  showModal(
    '<div class="modal-msg"><b>Instalar o Logbook</b></div>'+
    '<div class="help-block"><b>Android — Chrome</b><br>Menu ⋮ → "Instalar app" ou "Adicionar à tela inicial".</div>'+
    '<div class="help-block"><b>Computador — Chrome</b><br>Ícone de instalar na barra de endereço, ou menu ⋮ → "Instalar".</div>'+
    '<div class="help-block"><b>iPhone — Safari</b><br>Compartilhar → "Adicionar à Tela de Início".</div>'+
    '<div class="bw-hint">Os dados ficam salvos neste navegador, neste aparelho.</div>'+
    '<div class="modal-actions"><button class="btn-confirm" onclick="closeModal()">Entendi</button></div>'
  );
}
function renderNotice(){
  const bar = document.getElementById('noticeBar');
  if(!bar) return;
  bar.innerHTML=''; bar.className='';
  if(isInAppBrowser()){
    bar.className='notice-bar alert';
    bar.innerHTML='<div><b>Você abriu dentro de outro aplicativo.</b><br>Não dá para instalar e os dados podem se perder. Abra no <b>Google Chrome</b>.</div><div class="notice-actions"><button class="notice-btn primary" onclick="copyAppLink(this)">Copiar link</button></div>';
    return;
  }
  if(!storageWorks()){
    bar.className='notice-bar alert';
    bar.innerHTML='<div><b>Este navegador não está salvando os dados.</b><br>Abra no <b>Google Chrome</b>, em janela normal (não anônima).</div><div class="notice-actions"><button class="notice-btn primary" onclick="copyAppLink(this)">Copiar link</button></div>';
    return;
  }
  if(isStandalone()) return;
  try{ if(localStorage.getItem('install_notice_off')==='1') return; }catch(e){}
  bar.className='notice-bar info';
  bar.innerHTML='<div><b>Instale na tela inicial</b> para abrir como app e manter o histórico salvo.</div>'+
    '<div class="notice-actions">'+
      (deferredInstallPrompt ? '<button class="notice-btn primary" onclick="triggerInstall()">Instalar app</button>' : '<button class="notice-btn primary" onclick="showInstallHelp()">Como instalar</button>')+
      '<button class="notice-btn" onclick="dismissInstallNotice()">Dispensar</button>'+
    '</div>';
}

/* ============ INIT ============ */
async function init(){
  await loadData();
  const map = {1:'seg',2:'ter',3:'qua',4:'qui',5:'sex',6:'sab',0:'dom'};
  activeDayId = map[new Date().getDay()];
  renderDayBtns();
  renderDayContent();
  renderNotice();
  requestPersistentStorage();
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
